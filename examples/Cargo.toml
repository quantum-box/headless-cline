[package]
name = "headless-cline-examples"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cline-core = { path = "../crates/cline-core" }
tokio = { version = "1.36.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[[example]]
name = "mcp_command_stack"
path = "src/mcp_command_stack.rs"
